{% extends 'base.html' %}
{% block title %}Delete Habit - LevelUp Life{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto; padding: 1.5rem; background: white; border-radius: 8px; border: 1px solid #e2e8f0;">
  <h2>Delete Habit</h2>
  <p>Are you sure you want to delete <strong>"{{ habit.title }}"</strong>? This action will deactivate the habit.</p>
  <form method="POST">
    {% csrf_token %}
    <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
      <button type="submit" style="background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">Confirm Delete</button>
      <a href="{% url 'habits:habit_list' %}" style="padding: 8px 16px; color: #64748b; text-decoration: none;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
